name: nlu-library-ai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_library}
      POSTGRES_USER: ${POSTGRES_USER:-ai_library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - internal

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_FACE_OPENCV: ${INSTALL_FACE_OPENCV:-false}
    restart: "no"
    env_file:
      - .env
    environment: &backend-environment
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_library}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_library}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-mock}
      FACE_PROVIDER: ${FACE_PROVIDER:-mock}
      KIOSK_STREAM_ORIGINS: ${KIOSK_STREAM_ORIGINS:-http://localhost}
      FACE_DIAGNOSTICS_ENABLED: ${FACE_DIAGNOSTICS_ENABLED:-false}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_FACE_OPENCV: ${INSTALL_FACE_OPENCV:-false}
    restart: unless-stopped
    env_file:
      - .env
    environment: *backend-environment
    volumes:
      - media_data:/app/storage/media
      - ${FACE_MODELS_DIR:-./backend/models}:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  media_data:

networks:
  internal:
    driver: bridge
