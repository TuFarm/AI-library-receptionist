name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_library
          POSTGRES_USER: ai_library
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ai_library"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ai_library:ci-only-password@localhost:5432/ai_library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Migrations upgrade, downgrade and re-upgrade on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: App starts against the migrated database
        run: |
          uvicorn app.main:app --port 8000 &
          for attempt in $(seq 1 30); do curl -fs http://localhost:8000/api/v1/health/db && break; sleep 1; done
          curl -fs http://localhost:8000/api/v1/health/db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose-smoke:
    # Builds and starts the LAN deployment stack exactly as the server runs it, over HTTPS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure .env and a throwaway certificate
        run: |
          cp .env.production.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' .env
          sed -i 's#^KIOSK_STREAM_ORIGINS=.*#KIOSK_STREAM_ORIGINS=https://localhost#' .env
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost \
            -keyout certs/server-key.pem -out certs/server.pem
          chmod 644 certs/server-key.pem
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: HTTPS serves the app, HTTP redirects, /health stays on HTTP
        run: |
          curl -fsk https://localhost/health
          curl -fsk https://localhost/kiosk/fullscreen | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/kiosk/fullscreen)" = 301
          curl -s -o /dev/null -w '%{redirect_url}\n' http://localhost/kiosk/fullscreen | grep -qx 'https://localhost/kiosk/fullscreen'
          curl -fs http://localhost/health
      - name: Admin scripts are in the backend image
        run: docker compose exec -T backend python scripts/create_staff.py --help
      - name: Logs on failure
        if: failure()
        run: docker compose logs
